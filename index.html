<!-- UI Elements -->
<div id="statusText" class="text-slate-300 font-medium mb-2">Tap to Select Audio Track</div>
<input type="file" id="audioFileInput" accept="audio/*,.mp3,.wav,.m4a,.aac,.flac" class="hidden">

<!-- Optional styled button trigger -->
<label for="audioFileInput" class="cursor-pointer bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-white inline-block">
    Browse Audio File
</label>

<script>
    let audioContext = null;

    const fileInput = document.getElementById('audioFileInput');
    const statusText = document.getElementById('statusText');

    fileInput.addEventListener('change', async (event) => {
        // 4. Safely handle file object from event.target.files[0]
        const file = event.target.files?.[0];
        
        if (!file) {
            return;
        }

        try {
            // 1. Explicit User Gesture & AudioContext initialization/resumption for mobile autoplay policies
            if (!audioContext) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContextClass();
            }

            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }

            // Update UI to loading state
            statusText.textContent = 'Profiling...';

            // 2. Robust File Reading using FileReader.readAsArrayBuffer
            const arrayBuffer = await readFileAsArrayBuffer(file);

            // Decode audio data wrapped in the try/catch block
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

            // Success state
            statusText.textContent = `Loaded: ${file.name}`;
            
            // TODO: Pass your decoded audioBuffer into your analyzer pipeline here
            // runAnalyzer(audioBuffer);

        } catch (error) {
            // 3. Loading State Recovery & Error Handling
            console.error('Audio loading or decoding failed:', error);
            statusText.textContent = 'Tap to Select Audio Track';
            
            // Reset the file input value so selecting the same file again triggers the change event
            fileInput.value = '';
        }
    });

    // Helper utility to turn FileReader into a clean Promise
    function readFileAsArrayBuffer(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = (error) => reject(error);
            reader.readAsArrayBuffer(file);
        });
    }
</script>
