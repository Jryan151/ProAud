<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Analysis Brief Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <h1 class="text-2xl font-bold mb-2 text-indigo-400">Audio Brief Generator</h1>
        <p class="text-slate-400 text-sm mb-6">Upload an audio track to extract tempo, duration, and feature profiles via your backend server.</p>

        <!-- Configuration: Server IP -->
        <div class="mb-4">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Backend API URL</label>
            <input type="text" id="apiUrl" value="http://YOUR_SERVER_IP:8000/analyze/" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
        </div>

        <!-- File Drop / Upload Zone -->
        <div class="mb-6">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Audio File (.mp3, .wav)</label>
            <input type="file" id="audioFile" accept="audio/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
        </div>

        <button onclick="analyzeAudio()" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition-all shadow-lg shadow-indigo-600/20">
            Generate Brief
        </button>

        <!-- Loading State -->
        <div id="loader" class="hidden mt-6 text-center text-slate-400 text-sm animate-pulse">
            Analyzing audio features on server...
        </div>

        <!-- Results / Brief Display -->
        <div id="resultContainer" class="hidden mt-8 border-t border-slate-800 pt-6 space-y-4">
            <h2 class="text-lg font-semibold text-slate-200">Production Brief</h2>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800/60">
                    <span class="text-xs text-slate-500 block uppercase">Tempo (BPM)</span>
                    <span id="resBpm" class="text-xl font-bold text-indigo-400">--</span>
                </div>
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800/60">
                    <span class="text-xs text-slate-500 block uppercase">Duration</span>
                    <span id="resDuration" class="text-xl font-bold text-slate-200">--</span>
                </div>
            </div>

            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800/60 space-y-2">
                <span class="text-xs text-slate-500 block uppercase">Spectral & Tonal Profile (MFCC Summary)</span>
                <p id="resMfcc" class="text-xs font-mono text-slate-300 break-words leading-relaxed"></p>
            </div>
        </div>
    </div>

    <script>
        async function analyzeAudio() {
            const fileInput = document.getElementById('audioFile');
            const apiUrl = document.getElementById('apiUrl').value;
            const loader = document.getElementById('loader');
            const resultContainer = document.getElementById('resultContainer');

            if (fileInput.files.length === 0) {
                alert('Please select an audio file first.');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            loader.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Analysis failed on server.');

                const data = await response.json();
                
                // Populate fields (adjust keys based on your FastAPI response schema)
                document.getElementById('resBpm').innerText = Math.round(data.tempo || data.BPM || 120);
                document.getElementById('resDuration').innerText = `${(data.duration || 0).toFixed(2)}s`;
                document.getElementById('resMfcc').innerText = JSON.stringify(data.mfcc_mean || data, null, 2);

                resultContainer.classList.remove('hidden');
            } catch (error) {
                alert('Error connecting to backend: ' + error.message);
            } finally {
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
