<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Analysis Pipeline</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        input[type="file"] {
            margin: 1rem 0;
            width: 100%;
            color: #94a3b8;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        button:disabled {
            background: #64748b;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background: #2563eb;
        }
        #result {
            margin-top: 1.5rem;
            text-align: left;
            background: #0f172a;
            padding: 1rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            display: none;
            max-height: 250px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Audio Analysis</h2>
        <input type="file" id="audioFile" accept="audio/*">
        <button id="submitBtn" onclick="analyzeAudio()">Generate Brief</button>
        <div id="result"></div>
    </div>

    <script>
        async function analyzeAudio() {
            const fileInput = document.getElementById('audioFile');
            const submitBtn = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('result');

            if (fileInput.files.length === 0) {
                alert('Please select an audio file first.');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            // Lock UI controls during processing
            fileInput.disabled = true;
            submitBtn.disabled = true;
            submitBtn.innerText = 'Analyzing...';
            
            resultDiv.style.display = 'block';
            resultDiv.innerText = 'Analyzing audio... Please wait.';

            try {
                // REPLACE THE URL BELOW WITH YOUR ACTUAL CLOUDFLARE TUNNEL URL
                const BACKEND_URL = 'https://YOUR_CLOUDFLARE_URL.trycloudflare.com/analyze/';

                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server error (${response.status}): ${errorText || response.statusText}`);
                }

                const data = await response.json();
                resultDiv.innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                resultDiv.innerText = `Error: ${error.message}`;
            } finally {
                // Always unlock UI elements whether the request succeeds or fails
                fileInput.disabled = false;
                submitBtn.disabled = false;
                submitBtn.innerText = 'Generate Brief';
            }
        }
    </script>

</body>
</html>
