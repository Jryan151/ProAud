<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Profiler & Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/web-audio-beat-detector@8.2.32/build/esmodules/bundle.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
        <h1 class="text-xl font-bold">Mix Profiler Studio</h1>

        <!-- 1. Genre / Style Selector Option -->
        <div class="space-y-1">
            <label class="text-xs text-slate-400 font-semibold uppercase">Target Style / Genre</label>
            <select id="genreSelect" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-sm text-white">
                <option value="deephouse">Deep House / Slap House (120-128 BPM)</option>
                <option value="hiphop">Hip Hop / Trap (70-100 BPM)</option>
                <option value="pop">Pop / Commercial (115-130 BPM)</option>
            </select>
        </div>

        <!-- File Input Upload Block -->
        <div class="flex flex-col space-y-2 pt-2">
            <input type="file" id="audioFileInput" accept="audio/*,.mp3,.wav,.m4a,.aac,.flac" class="hidden">
            <label for="audioFileInput" id="statusLabel" class="cursor-pointer bg-blue-600 hover:bg-blue-500 text-center py-3 px-4 rounded-xl font-medium transition-colors">
                Upload Track for Analysis
            </label>
        </div>

        <!-- Categorized Results Panel -->
        <div id="resultsPanel" class="hidden space-y-3 bg-slate-700/50 p-4 rounded-xl border border-slate-600 text-sm">
            <div class="border-b border-slate-600 pb-2">
                <p class="text-slate-400 text-xs uppercase">File Name</p>
                <p id="fileName" class="font-semibold truncate"></p>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <p class="text-slate-400 text-xs uppercase">Detected BPM</p>
                    <p id="trackBpm" class="font-bold text-green-400 text-lg">--</p>
                </div>
                <div>
                    <p class="text-slate-400 text-xs uppercase">Style Match</p>
                    <p id="trackStyle" class="font-bold text-cyan-400 text-lg">--</p>
                </div>
            </div>
            <div>
                <p class="text-slate-400 text-xs uppercase">Frequency Balance Profile</p>
                <p id="freqProfile" class="text-slate-300 text-xs mt-0.5">Analyzing spectral energy...</p>
            </div>
        </div>
    </div>

    <script>
        let audioContext = null;
        const fileInput = document.getElementById('audioFileInput');
        const statusLabel = document.getElementById('statusLabel');
        const resultsPanel = document.getElementById('resultsPanel');
        const fileNameEl = document.getElementById('fileName');
        const trackBpmEl = document.getElementById('trackBpm');
        const trackStyleEl = document.getElementById('trackStyle');
        const freqProfileEl = document.getElementById('freqProfile');
        const genreSelect = document.getElementById('genreSelect');

        fileInput.addEventListener('change', async (event) => {
            const file = event.target.files?.[0];
            if (!file) return;

            try {
                // Initialize AudioContext safely for mobile
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                // Update UI Loading State
                statusLabel.textContent = 'Processing pipeline...';
                resultsPanel.classList.remove('hidden');
                fileNameEl.textContent = file.name;
                trackBpmEl.textContent = 'Analyzing...';
                trackStyleEl.textContent = genreSelect.options[genreSelect.selectedIndex].text.split(' ')[0];
                freqProfileEl.textContent = 'Scanning audio buffers...';

                // Pipeline Step 1: Read File ArrayBuffer
                const arrayBuffer = await readFileAsArrayBuffer(file);

                // Pipeline Step 2: Decode Audio Data
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

                // Pipeline Step 3: Run Feature Extractors Concurrently
                const bpmPromise = window.webAudioBeatDetector.analyze(audioBuffer).catch(() => null);
                const spectralProfile = analyzeSpectralEnergy(audioBuffer);

                const detectedBpm = await bpmPromise;

                // Pipeline Step 4: Render Categorized Results
                trackBpmEl.textContent = detectedBpm ? Math.round(detectedBpm) : 'Estimated (Check transients)';
                freqProfileEl.textContent = spectralProfile;

                statusLabel.textContent = 'Upload Another Track';
            } catch (error) {
                console.error('Pipeline failed:', error);
                statusLabel.textContent = 'Upload Track for Analysis';
                resultsPanel.classList.add('hidden');
                fileInput.value = '';
            }
        });

        function readFileAsArrayBuffer(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = (error) => reject(error);
                reader.readAsArrayBuffer(file);
            });
        }

        function analyzeSpectralEnergy(buffer) {
            // Basic client-side heuristic analyzing channel data energy distribution
            const channelData = buffer.getChannelData(0);
            let sumSquares = 0;
            for (let i = 0; i < channelData.length; i += 100) { // sampled for performance
                sumSquares += channelData[i] ** 2;
            }
            const rms = Math.sqrt(sumSquares / (channelData.length / 100));
            
            if (rms > 0.15) {
                return "High RMS / Compressed Master Profile (Heavy limiter detected)";
            } else if (rms > 0.08) {
                return "Balanced Dynamic Mix Profile (Good headroom)";
            } else {
                return "Wide Dynamic Range / Unmastered Mix Track";
            }
        }
    </script>
</body>
</html>
