<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Analyzer</title>
    <style>
        :root {
            --bg: #121214;
            --panel: #1e1e24;
            --accent: #00e5ff;
            --text: #e2e8f0;
            --muted: #8a99ad;
            --border: #2a2a35;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            color: #fff;
        }

        .upload-box {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            background: rgba(255,255,255,0.01);
        }

        .upload-box:hover, .upload-box:active {
            border-color: var(--accent);
            background: rgba(0, 229, 255, 0.05);
        }

        .upload-box input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            pointer-events: none;
        }

        .upload-sub {
            font-size: 11px;
            color: var(--muted);
            margin-top: 6px;
            pointer-events: none;
        }

        .status {
            font-size: 12px;
            color: var(--accent);
            text-align: center;
            min-height: 18px;
            font-family: monospace;
        }

        .results {
            background: #141418;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .results.active {
            display: flex;
        }

        .result-title {
            font-size: 13px;
            font-weight: bold;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
            word-break: break-all;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .metric-label {
            color: var(--muted);
        }

        .metric-value {
            font-family: monospace;
            font-weight: bold;
            color: #fff;
        }

        .audio-player-container {
            margin-top: 6px;
            width: 100%;
        }

        audio {
            width: 100%;
            height: 36px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Audio Analyzer</h1>

        <div class="upload-box" id="uploadBox">
            <input type="file" id="fileInput" accept="audio/*,.wav,.mp3,.m4a,.aac,.flac">
            <div class="upload-text">Tap to Select Audio Track</div>
            <div class="upload-sub">Supports MP3, WAV, M4A, AAC</div>
        </div>

        <div class="status" id="statusText"></div>

        <div class="results" id="resultsPanel">
            <div class="result-title" id="resFilename">filename.wav</div>
            
            <div class="metric-row">
                <span class="metric-label">Duration</span>
                <span class="metric-value" id="resDuration">0:00</span>
            </div>
            <div class="metric-row">
                <span class="metric-label">Peak Amplitude</span>
                <span class="metric-value" id="resPeak">0.00 dB</span>
            </div>
            <div class="metric-row">
                <span class="metric-label">Sample Rate</span>
                <span class="metric-value" id="resSampleRate">0 Hz</span>
            </div>
            <div class="metric-row">
                <span class="metric-label">Channels</span>
                <span class="metric-value" id="resChannels">0</span>
            </div>

            <div class="audio-player-container">
                <audio id="audioPlayer" controls></audio>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const statusText = document.getElementById('statusText');
        const resultsPanel = document.getElementById('resultsPanel');
        const resFilename = document.getElementById('resFilename');
        const resDuration = document.getElementById('resDuration');
        const resPeak = document.getElementById('resPeak');
        const resSampleRate = document.getElementById('resSampleRate');
        const resChannels = document.getElementById('resChannels');
        const audioPlayer = document.getElementById('audioPlayer');

        fileInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            const file = files[0];
            statusText.textContent = `Loading ${file.name}...`;
            resultsPanel.classList.remove('active');

            try {
                // 1. Setup standard audio element playback preview
                const objectUrl = URL.createObjectURL(file);
                audioPlayer.src = objectUrl;

                statusText.textContent = `Decoding audio buffer...`;

                // 2. Read raw binary array buffer
                const arrayBuffer = await file.arrayBuffer();

                // 3. Decode audio data via Web Audio API
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioContextClass();
                
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                statusText.textContent = `Analyzing metrics...`;

                // 4. Calculate actual metrics from channel data
                const durationSec = audioBuffer.duration;
                const sampleRate = audioBuffer.sampleRate;
                const numberOfChannels = audioBuffer.numberOfChannels;

                // Scan PCM data to find peak amplitude
                let maxSample = 0;
                for (let channel = 0; channel < numberOfChannels; channel++) {
                    const channelData = audioBuffer.getChannelData(channel);
                    for (let i = 0; i < channelData.length; i++) {
                        const absVal = Math.abs(channelData[i]);
                        if (absVal > maxSample) {
                            maxSample = absVal;
                        }
                    }
                }

                // Convert peak amplitude to decibels (dBFS)
                const peakDb = maxSample > 0 ? (20 * Math.log10(maxSample)).toFixed(2) : '-99.00';

                // Format duration to M:SS
                const mins = Math.floor(durationSec / 60);
                const secs = Math.floor(durationSec % 60);
                const formattedDuration = `${mins}:${secs < 10 ? '0' : ''}${secs} (${Math.round(durationSec)}s)`;

                // 5. Display results on UI
                resFilename.textContent = file.name;
                resDuration.textContent = formattedDuration;
                resPeak.textContent = `${peakDb} dBFS`;
                resSampleRate.textContent = `${sampleRate.toLocaleString()} Hz`;
                resChannels.textContent = numberOfChannels === 1 ? 'Mono (1)' : (numberOfChannels === 2 ? 'Stereo (2)' : `${numberOfChannels} Channels`);

                statusText.textContent = `Analysis complete.`;
                resultsPanel.classList.add('active');

                // Clean up context
                audioCtx.close();

            } catch (err) {
                console.error(err);
                statusText.textContent = `Error: Could not decode file format. Try a standard MP3/WAV.`;
            } finally {
                // Reset file input so user can re-upload the same file if needed
                fileInput.value = '';
            }
        });
    </script>
</body>
</html>
